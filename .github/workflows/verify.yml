name: verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify checked-out PR head
        id: checked-out-head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_head_sha="$(git rev-parse HEAD)"
          if [[ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "Checked-out HEAD $actual_head_sha does not match expected PR head $EXPECTED_HEAD_SHA." >&2
            exit 1
          fi
          echo "tested_head_sha=$actual_head_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Relay verification commit"
            echo "Tested PR head: \`$actual_head_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
